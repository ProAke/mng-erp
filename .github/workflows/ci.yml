name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  # ---------- 1. unit tests (ไม่ต้อง DB) ----------
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test -- --project=unit

  # ---------- 2. security ----------
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm audit (root)
        run: npm audit --audit-level=high || true
      - name: npm audit (web)
        working-directory: web
        run: npm audit --audit-level=high || true

  # ---------- 3. Next.js web ----------
  web:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npx tsc --noEmit
      - name: Build
        working-directory: web
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/.next/
          retention-days: 7

  # ---------- 4. server integration (ต้อง DB) ----------
  integration:
    runs-on: ubuntu-latest
    needs: unit
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: test_auth
        ports:
          - 3306
        options: >-
          --health-cmd="mysqladmin ping -ptest"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_AUTH_HOST: 127.0.0.1
      DB_AUTH_PORT: ${{ job.services.mysql.ports['3306'] }}
      DB_AUTH_USER: root
      DB_AUTH_PASS: test
      DB_AUTH_NAME: test_auth
      DB_WORK_HOST: 127.0.0.1
      DB_WORK_PORT: ${{ job.services.mysql.ports['3306'] }}
      DB_WORK_USER: root
      DB_WORK_PASS: test
      DB_WORK_NAME: test_work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Create works database
        run: |
          mysql -h 127.0.0.1 -P "${{ job.services.mysql.ports['3306'] }}" -uroot -ptest \
            -e "CREATE DATABASE IF NOT EXISTS test_work CHARACTER SET utf8mb4;"

      - name: Seed
        working-directory: server
        run: node seed.js

      - name: Boot server + smoke test
        working-directory: server
        run: |
          node index.js > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health > /tmp/health.json 2>/dev/null; then break; fi
            sleep 1
          done
          echo "=== /api/health ==="
          cat /tmp/health.json
          echo
          CODE=$(curl -s -o /tmp/login.json -w "%{http_code}" -X POST http://127.0.0.1:8080/api/auth/login \
            -H 'Content-Type: application/json' -d '{"email":"nobody@test.com","password":"wrong"}')
          echo "=== login HTTP $CODE ==="
          cat /tmp/login.json
          echo
          if [ "$CODE" != "401" ]; then
            echo "::error::login ต้องคือ 401 ไม่ใช่ $CODE"
            cat /tmp/server.log
            kill $SERVER_PID; exit 1
          fi
          kill $SERVER_PID

      - name: Integration tests
        run: npx vitest run --project=integration
